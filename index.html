<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodrigo "Ardillón" Rodríguez — ¡La Madriguera Alegre! 🌰</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Chango&family=Fredoka+One&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* ===== VARIABLES Y ESTILOS BASE ===== */
        :root {
            --color-verde-primavera: #7CB342;
            --color-amarillo-sol: #FDD835;
            --color-naranja-alegre: #FF9800;
            --color-marron-bellota: #8D6E63;
            --color-marron-oscuro: #5D4037;
            --color-crema-fondo: #FFFDE7;
            --fuente-titulo: 'Chango', cursive;
            --fuente-subtitulo: 'Luckiest Guy', cursive;
            --fuente-botones: 'Fredoka One', cursive;
            --fuente-cuerpo: 'Open Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-crema-fondo);
            /* Patrón de fondo superalegre y dinámico */
            background-image: 
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgdmlld0JveD0iMCAwIDYwIDYwIj48ZyBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiNGRDgzNSIgZmlsbC1vcGFjaXR5PSIwLjA5Ij48cGF0aCBkPSJNMCAwaDYwdjYwSDBWMnpNMjAgMjBoMjB2MjBIMlYyMHpNMCAyMGgyMHYyMEgwVjIwek0yMCAwaDIwdjIwSDIwVjB6Ii8+PC9nPjwvZz48L3N2Zz4='),
                radial-gradient(circle at 10% 20%, rgba(124, 179, 66, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 152, 0, 0.1) 0%, transparent 40%);
            color: var(--color-marron-oscuro);
            font-family: var(--fuente-cuerpo);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .madriguera-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            gap: 80px;
        }

        /* ===== HERO SECTION (CABECERA) ===== */
        .hero {
            text-align: center;
            background: white;
            padding: 80px 40px;
            border-radius: 50px;
            box-shadow: 0 20px 0 var(--color-amarillo-sol), 0 30px 60px rgba(0,0,0,0.1);
            border: 8px solid var(--color-verde-primavera);
            position: relative;
        }

        /* Animación sutil de rebote en el hero */
        @keyframes hero-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .hero { animation: hero-bounce 4s ease-in-out infinite; }

        .logo-ardilla {
            font-size: 100px;
            margin-bottom: 20px;
            display: block;
        }

        .titulo-principal {
            font-family: var(--fuente-titulo);
            font-size: 70px;
            color: var(--color-marron-oscuro);
            text-shadow: 4px 4px 0 var(--color-amarillo-sol), 8px 8px 0 var(--color-naranja-alegre);
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .subtitulo {
            font-family: var(--fuente-subtitulo);
            font-size: 32px;
            color: var(--color-verde-primavera);
            letter-spacing: 2px;
            background: rgba(124, 179, 66, 0.1);
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            margin-top: 15px;
        }

        /* ===== GALERÍA DE FOTOS DINÁMICA ===== */
        .galeria-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .seccion-titulo {
            font-family: var(--fuente-subtitulo);
            font-size: 48px;
            color: var(--color-marron-oscuro);
            text-align: center;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
        }
        .seccion-titulo::after {
            content: '🌰🐿️🌰';
            position: absolute;
            bottom: -25px; left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
        }

        .fotos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            width: 100%;
        }

        .foto-card {
            background: white;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid #F0F0F0;
            position: relative;
            overflow: hidden;
        }

        .foto-card:hover {
            transform: translateY(-15px) scale(1.03) rotate(2deg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            border-color: var(--color-amarillo-sol);
        }

        .foto-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 20px;
            display: block;
        }

        .foto-caption {
            font-family: var(--fuente-cuerpo);
            font-weight: 600;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
            color: var(--color-marron-oscuro);
        }

        /* ===== SECCIÓN DE DONACIONES (OPERACIÓN BELLOTA) ===== */
        .donaciones {
            background: var(--color-naranja-alegre);
            color: white;
            padding: 80px 40px;
            border-radius: 50px;
            text-align: center;
            box-shadow: 0 15px 0 var(--color-marron-oscuro), 0 30px 60px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        /* Decoración de fondo de bellotas en las donaciones */
        .donaciones::before {
            content: '🌰';
            position: absolute;
            font-size: 200px;
            opacity: 0.1;
            top: -50px; left: -50px;
            transform: rotate(-30deg);
        }
        .donaciones::after {
            content: '🌰';
            position: absolute;
            font-size: 150px;
            opacity: 0.1;
            bottom: -40px; right: -40px;
            transform: rotate(20deg);
        }

        .titulo-donaciones {
            font-family: var(--fuente-titulo);
            font-size: 50px;
            text-shadow: 3px 3px 0 var(--color-marron-oscuro);
            margin-bottom: 20px;
        }

        .texto-donaciones {
            font-size: 20px;
            margin-bottom: 40px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .botones-donar {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-donar {
            font-family: var(--fuente-botones);
            font-size: 22px;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
            border: none;
            cursor: pointer;
        }

        .btn-donar:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 0 rgba(0,0,0,0.2);
        }
        .btn-donar:active {
            transform: translateY(2px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .btn-bellota {
            background-color: var(--color-amarillo-sol);
            color: var(--color-marron-oscuro);
        }
        .btn-super-bellota {
            background-color: white;
            color: var(--color-naranja-alegre);
        }

        /* ===== CTA SECTION (CONTACTO) ===== */
        .cta {
            text-align: center;
            background: var(--color-marron-oscuro);
            color: white;
            padding: 60px 40px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .titulo-cta {
            font-family: var(--fuente-subtitulo);
            font-size: 36px;
            margin-bottom: 15px;
            color: var(--color-amarillo-sol);
        }

        .numero-contacto {
            font-family: var(--fuente-botones);
            font-size: 40px;
            color: white;
            background: rgba(255,255,255,0.1);
            padding: 15px 30px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 15px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        /* ===== PIE DE PÁGINA "LA MADRIGUERA FINALE" ===== */
        footer {
            text-align: center;
            padding: 40px;
            color: var(--color-marron-bellota);
            font-size: 14px;
            border-top: 2px dashed var(--color-marron-bellota);
            margin-top: auto;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .titulo-principal { font-size: 40px; }
            .subtitulo { font-size: 20px; }
            .logo-ardilla { font-size: 60px; }
            .seccion-titulo { font-size: 32px; }
            .titulo-donaciones { font-size: 36px; }
            .numero-contacto { font-size: 28px; }
        }

    </style>
</head>

            <span class="logo-ardilla">🐿️</span>

            <div class="subtitulo">¡El Único e Inigualable Ard
